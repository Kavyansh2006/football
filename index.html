<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Tactical Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Clean Top Bar with Formation Selectors & Reset -->
  <header class="simple-header">
    <div class="logo">
      <span class="ball-icon">⚽</span>
      <h1>Football Board</h1>
    </div>

    <!-- Formation Controls for Both Teams -->
    <div class="formation-controls">
      <!-- Blue Team Selector -->
      <div class="team-control blue-control">
        <span class="badge blue"></span>
        <label for="blue-formation">Blue Team:</label>
        <select id="blue-formation" class="select-formation">
          <option value="4-3-3" selected>4-3-3 Attack</option>
          <option value="4-4-2">4-4-2 Classic</option>
          <option value="4-2-3-1">4-2-3-1 Double Pivot</option>
          <option value="3-5-2">3-5-2 Wing-Backs</option>
          <option value="5-3-2">5-3-2 Defensive</option>
          <option value="3-4-3">3-4-3 Total Attack</option>
        </select>
      </div>

      <!-- Red Team Selector -->
      <div class="team-control red-control">
        <span class="badge red"></span>
        <label for="red-formation">Red Team:</label>
        <select id="red-formation" class="select-formation">
          <option value="4-2-3-1" selected>4-2-3-1 Double Pivot</option>
          <option value="4-3-3">4-3-3 Attack</option>
          <option value="4-4-2">4-4-2 Classic</option>
          <option value="3-5-2">3-5-2 Wing-Backs</option>
          <option value="5-3-2">5-3-2 Defensive</option>
          <option value="3-4-3">3-4-3 Total Attack</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="btn-reset" class="btn" title="Reset all chips and ball to default positions">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        Reset Board
      </button>
    </div>
  </header>

  <!-- Pitch Container -->
  <main class="pitch-container">
    <div class="pitch-card">
      <svg id="football-pitch" viewBox="0 0 680 960">
        <defs>
          <!-- Soft Player Drop Shadow -->
          <filter id="chip-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
          </filter>
          <!-- Goal Net Pattern -->
          <pattern id="goal-net" width="6" height="6" patternUnits="userSpaceOnUse">
            <path d="M 0 0 L 6 6 M 6 0 L 0 6" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35"/>
          </pattern>
        </defs>

        <!-- Pitch Grass Base -->
        <rect x="0" y="0" width="680" height="960" fill="#14532d" rx="8"/>

        <!-- Alternating Mowing Stripes -->
        <g id="grass-stripes">
          <rect x="30" y="30" width="620" height="90" fill="#1e5c33"/>
          <rect x="30" y="120" width="620" height="90" fill="#246d3d"/>
          <rect x="30" y="210" width="620" height="90" fill="#1e5c33"/>
          <rect x="30" y="300" width="620" height="90" fill="#246d3d"/>
          <rect x="30" y="390" width="620" height="90" fill="#1e5c33"/>
          <rect x="30" y="480" width="620" height="90" fill="#246d3d"/>
          <rect x="30" y="570" width="620" height="90" fill="#1e5c33"/>
          <rect x="30" y="660" width="620" height="90" fill="#246d3d"/>
          <rect x="30" y="750" width="620" height="90" fill="#1e5c33"/>
          <rect x="30" y="840" width="620" height="90" fill="#246d3d"/>
        </g>

        <!-- White Pitch Lines -->
        <g stroke="#ffffff" stroke-width="3" fill="none" opacity="0.9">
          <!-- Touchlines -->
          <rect x="30" y="30" width="620" height="900"/>

          <!-- Halfway Line -->
          <line x1="30" y1="480" x2="650" y2="480"/>

          <!-- Center Circle & Spot -->
          <circle cx="340" cy="480" r="80"/>
          <circle cx="340" cy="480" r="4" fill="#ffffff"/>

          <!-- Corner Arcs -->
          <path d="M 30 46 A 16 16 0 0 0 46 30"/>
          <path d="M 634 30 A 16 16 0 0 0 650 46"/>
          <path d="M 30 914 A 16 16 0 0 1 46 930"/>
          <path d="M 634 930 A 16 16 0 0 1 650 914"/>

          <!-- Top Penalty Area -->
          <rect x="155" y="30" width="370" height="145"/>
          <rect x="255" y="30" width="170" height="48"/>
          <circle cx="340" cy="125" r="3.5" fill="#ffffff"/>
          <path d="M 280 175 A 80 80 0 0 0 400 175"/>

          <!-- Bottom Penalty Area -->
          <rect x="155" y="785" width="370" height="145"/>
          <rect x="255" y="882" width="170" height="48"/>
          <circle cx="340" cy="835" r="3.5" fill="#ffffff"/>
          <path d="M 280 785 A 80 80 0 0 1 400 785"/>

          <!-- Goals & Nets -->
          <rect x="302" y="10" width="76" height="20" fill="url(#goal-net)" stroke="#ffffff" stroke-width="2"/>
          <rect x="302" y="930" width="76" height="20" fill="url(#goal-net)" stroke="#ffffff" stroke-width="2"/>
        </g>

        <!-- Player Chips Layer -->
        <g id="players-layer"></g>

        <!-- Match Football -->
        <g id="football" transform="translate(340, 480)" style="cursor: grab;" filter="url(#chip-shadow)">
          <circle cx="0" cy="0" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
          <polygon points="0,-4 3.8,-1.2 2.3,3.2 -2.3,3.2 -3.8,-1.2" fill="#0f172a"/>
          <line x1="0" y1="-4" x2="0" y2="-9.5" stroke="#0f172a" stroke-width="1.2"/>
          <line x1="3.8" y1="-1.2" x2="9" y2="-3" stroke="#0f172a" stroke-width="1.2"/>
          <line x1="2.3" y1="3.2" x2="6" y2="8" stroke="#0f172a" stroke-width="1.2"/>
          <line x1="-2.3" y1="3.2" x2="-6" y2="8" stroke="#0f172a" stroke-width="1.2"/>
          <line x1="-3.8" y1="-1.2" x2="-9" y2="-3" stroke="#0f172a" stroke-width="1.2"/>
        </g>
      </svg>
    </div>
  </main>

  <!-- Player Name & Details Edit Modal -->
  <div class="edit-modal-backdrop" id="edit-modal" style="display: none;">
    <div class="edit-modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Edit Player</h3>
        <button id="modal-close-btn" class="close-x">&times;</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label for="player-name-input">Player Name</label>
          <input type="text" id="player-name-input" placeholder="e.g. Messi, Haaland, Van Dijk" maxlength="20">
        </div>
        <div class="input-row">
          <div class="input-group">
            <label for="player-number-input">Shirt Number</label>
            <input type="number" id="player-number-input" min="1" max="99" value="10">
          </div>
          <div class="input-group">
            <label for="player-role-input">Position Label</label>
            <input type="text" id="player-role-input" placeholder="e.g. ST, CM, CB" maxlength="5">
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="btn secondary">Cancel</button>
        <button id="modal-save-btn" class="btn primary">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
